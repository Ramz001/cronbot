name: Send Discord Message

on:
  schedule:
    # Every other day at 09:00 UTC (odd-numbered days of the month).
    # Note: cron has no true "every other day"; */2 runs on days 1, 3, 5, ...
    # and two consecutive runs can occur across a month boundary (31 -> 1).
    - cron: '0 9 */2 * *'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send Discord message
        env:
          DISCORD_TOKEN: ${{ vars.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
          DISCORD_MESSAGE: ${{ vars.DISCORD_MESSAGE }}
        run: node scripts/send-message.js
